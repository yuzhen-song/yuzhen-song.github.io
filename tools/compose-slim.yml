# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:slim
    working_dir: /srv/jekyll
    command: ["bash", "scripts/serve.sh"]
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - ..:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
